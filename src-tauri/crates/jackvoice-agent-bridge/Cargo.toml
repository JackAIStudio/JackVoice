[package]
name = "jackvoice-agent-bridge"
version = "0.1.0"
description = "Read-only JackVoice glossary MCP for local agents"
authors = ["JackVoice contributors"]
license = "Apache-2.0"
repository = "https://github.com/JackAIStudio/JackVoice"
publish = false
rust-version = "1.88"
edition = "2021"

[[bin]]
name = "jackvoice-mcp"
path = "src/bin/jackvoice-mcp.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
