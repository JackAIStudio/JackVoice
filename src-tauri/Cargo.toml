[package]
name = "jackvoice"
version = "0.1.0"
description = "Cross-platform global dictation powered by Volcengine Doubao streaming ASR"
authors = ["JackVoice contributors"]
license = "Apache-2.0"
repository = "https://github.com/JackAIStudio/JackVoice"
rust-version = "1.88"
edition = "2021"

[lib]
name = "jackvoice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
openssl = { version = "0.10", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
reqwest = { version = "0.13", features = ["json", "multipart"] }
futures-util = "0.3"
cpal = "0.16"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"
fs2 = "0.4"
chrono = { version = "0.4", features = ["clock", "serde"] }
url = "2"
http = "1"
base64 = "0.22"
webrtc-audio-processing = { version = "~2.1", features = ["bundled"] }
keyring = "4.1.6"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = "0.3"
