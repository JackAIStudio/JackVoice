name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在且与 package.json 版本一致的发布标签，例如 v8.17.15"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-macos:
    name: Sign, notarize and draft release
    runs-on: macos-14
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/.release-cargo-target
      JACKVOICE_BUILD_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      JACKVOICE_APPLE_TEAM_ID: ${{ vars.JACKVOICE_APPLE_TEAM_ID }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Verify release tag and version
        shell: bash
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "::error::发布标签 $RELEASE_TAG 与版本 $expected_tag 不一致"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.88.0"

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      - name: Install native build dependencies
        run: brew install meson ninja pkg-config

      - name: Install JavaScript dependencies and run build-script tests
        run: |
          npm ci
          npm test

      - name: Prepare App Store Connect API private key
        shell: bash
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [[ -z "$APPLE_API_PRIVATE_KEY" ]]; then
            echo "::error::缺少 APPLE_API_PRIVATE_KEY"
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          umask 077
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build, sign, notarize and verify DMG
        run: npm run build:desktop:release

      - name: Create draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          delivery_root="$CARGO_TARGET_DIR/release/bundle/dmg/delivery"
          shopt -s nullglob
          delivery_dirs=("$delivery_root"/build-"$JACKVOICE_BUILD_ID"-*)
          if [[ "${#delivery_dirs[@]}" -ne 1 || ! -d "${delivery_dirs[0]}" ]]; then
            echo "::error::预期当前构建标识对应 1 个交付目录，实际找到 ${#delivery_dirs[@]} 个"
            exit 1
          fi
          delivery_dir="${delivery_dirs[0]}"
          dmg_assets=("$delivery_dir"/JackVoice-*.dmg)
          release_assets=(
            "${dmg_assets[0]}#macOS Apple 芯片安装包（DMG）"
            "$delivery_dir/SHA256SUMS.txt#SHA-256 校验文件"
            "$delivery_dir/release-manifest.json#发布校验清单"
          )
          if [[ "${#dmg_assets[@]}" -ne 1 || ! -f "$delivery_dir/SHA256SUMS.txt" || ! -f "$delivery_dir/release-manifest.json" ]]; then
            echo "::error::交付目录必须包含 1 个 DMG、SHA256SUMS.txt 和 release-manifest.json"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::GitHub Release $RELEASE_TAG 已存在，已拒绝覆盖"
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${release_assets[@]}" \
            --draft \
            --verify-tag \
            --generate-notes \
            --notes "## 下载

          ### macOS（Apple 芯片）

          [下载 JackVoice ${RELEASE_TAG#v} 安装包（DMG）](https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/$(basename "${dmg_assets[0]}"))

          适用于搭载 Apple 芯片的 Mac。下载后打开 DMG，将 JackVoice 拖入 Applications 即可安装。" \
            --title "JackVoice ${RELEASE_TAG#v}"
