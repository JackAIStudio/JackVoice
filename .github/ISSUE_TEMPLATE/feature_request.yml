name: 功能建议
description: 描述真实使用场景、约束和期望结果。
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我没有提交 API Key、录音、私人转写文本或其他敏感信息。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述实际场景，而不只是界面或实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
