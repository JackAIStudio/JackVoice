<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/jackvoice-icon.svg" type="image/svg+xml" />
    <title>JackVoice 待办备忘</title>
    <link rel="stylesheet" href="/src/memos.css" />
    <script type="module" src="/src/memos.ts" defer></script>
    <style>
      html, body {
        background: transparent !important;
      }
    </style>
  </head>
  <body>
    <div class="memos-container">
      <header class="memos-header">
        <div class="memos-title-wrap">
          <span class="memos-icon">📌</span>
          <span class="memos-title">待办备忘</span>
          <span class="memos-badge" id="memos-count">0</span>
        </div>
        <div class="memos-actions">
          <button id="clear-btn" class="header-btn" title="清理已完成事项">清理已完成</button>
        </div>
      </header>

      <main class="memos-list" id="memos-list">
        <div class="empty-state">
          <div class="empty-icon">📝</div>
          <div class="empty-title">暂无待办事项</div>
          <div class="empty-desc">听写说话时点亮胶囊上的 📌 图标<br/>内容将自动收入此处</div>
        </div>
      </main>

      <footer class="memos-footer">
        <div class="footer-tip">💡 单击条目一键复制 · 听写时点亮 📌 自动收入</div>
      </footer>
    </div>
  </body>
</html>
