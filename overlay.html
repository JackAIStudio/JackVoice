<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/jackvoice-icon.svg" type="image/svg+xml" />
    <title>JackVoice Overlay</title>
    <link rel="stylesheet" href="/src/overlay.css" />
    <script type="module" src="/src/overlay.ts" defer></script>
    <style>
      html, body {
        background: transparent !important;
      }
    </style>
  </head>
  <body>
    <div class="capsule" id="capsule">
      <button id="cancel-btn" class="icon-btn" title="取消">×</button>
      <div class="content" id="drag-region">
        <div id="overlay-status" class="status">正在听写</div>
        <div id="overlay-text" class="text empty">等待语音…</div>
      </div>
      <button id="pin-btn" class="icon-btn pin-btn" title="置顶为待办备忘（本次有效）">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="17" x2="12" y2="22" />
          <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V5h1a1 1 0 0 0 0-2H8a1 1 0 0 0 0 2h1v5.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17z" />
        </svg>
      </button>
      <button id="confirm-btn" class="icon-btn primary" title="结束并确认">✓</button>
      <button id="retry-btn" class="result-btn retry-btn hidden" title="重新尝试插入，保持剪贴板不变">重试</button>
      <button id="copy-btn" class="copy-btn hidden" title="复制到剪贴板">复制</button>
    </div>
  </body>
</html>
